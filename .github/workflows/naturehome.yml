name: Nature Home (launcher Android TV)

on:
  push:
    paths:
      - "android-tv/launcher/**"
      - ".github/workflows/naturehome.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv/launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilation de l'APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Renommage
        run: cp app/build/outputs/apk/release/app-release.apk NatureHome.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NatureHome-apk
          path: android-tv/launcher/NatureHome.apk

      - name: Publication (release « naturehome-latest »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete naturehome-latest --yes --cleanup-tag || true
          gh release create naturehome-latest NatureHome.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Nature Home (dernière compilation)" \
            --notes "APK compilé depuis ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Installer avec : python3 android-tv/tvtool.py launcher"
